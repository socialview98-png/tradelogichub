<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Risk Reward Calculator | TradeLogicHub</title>

<link rel="stylesheet" href="css/calculator.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header class="calculator-header">
    <h1>Risk Reward Calculator</h1>
    <p>Calculate your trade risk, reward and position quality</p>
</header>


<section class="calculator-container">

<div class="calculator-card">

    <div class="calculator-title">
        <i class="fa-solid fa-chart-line"></i>
        <h2>Trade Setup</h2>
    </div>


    <div class="input-grid">

        <div class="input-box">
            <label>Entry Price</label>
            <input type="number" id="entryPrice" placeholder="Enter entry price">
        </div>


        <div class="input-box">
            <label>Stop Loss</label>
            <input type="number" id="stopLoss" placeholder="Enter stop loss">
        </div>


        <div class="input-box">
            <label>Target Price</label>
            <input type="number" id="targetPrice" placeholder="Enter target price">
        </div>


        <div class="input-box">
            <label>Quantity</label>
            <input type="number" id="quantity" placeholder="Enter quantity">
        </div>

    </div>


    <button onclick="calculateRiskReward()" class="calculate-btn">
        Calculate
    </button>


    <div class="result-box">

        <div class="result-card">
            <h3>Risk</h3>
            <p id="riskAmount">$0</p>
        </div>


        <div class="result-card">
            <h3>Reward</h3>
            <p id="rewardAmount">$0</p>
        </div>


        <div class="result-card">
            <h3>Ratio</h3>
            <p id="rrRatio">1:0</p>
        </div>


        <div class="result-card">
            <h3>Status</h3>
            <p id="tradeStatus">Waiting</p>
        </div>

    </div>


</div>

</section>


<script src="js/calculator.js"></script>

</body>
</html>
