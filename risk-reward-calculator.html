<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Risk Reward Calculator | TradeLogicHub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="calculator-page">

<div class="calculator-card">

<h1>Risk Reward Calculator</h1>

<p>
Calculate your trading risk, reward and risk to reward ratio before taking a trade.
</p>


<div class="input-group">

<label>Entry Price</label>
<input type="number" id="entry" placeholder="Example: 100">

</div>


<div class="input-group">

<label>Stop Loss Price</label>
<input type="number" id="stoploss" placeholder="Example: 95">

</div>


<div class="input-group">

<label>Target Price</label>
<input type="number" id="target" placeholder="Example: 110">

</div>


<div class="input-group">

<label>Quantity</label>
<input type="number" id="quantity" placeholder="Example: 10">

</div>


<button onclick="calculateRR()">
Calculate
</button>


<div class="result-box">

<h2>Result</h2>

<p id="risk"></p>
<p id="reward"></p>
<p id="ratio"></p>
<p id="amount"></p>

</div>


</div>

</section>


<script src="calculator.js"></script>

</body>
</html>
